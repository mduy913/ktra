<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Kiểm tra truy cập</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body>
<h2>Xin chào</h2>
<p id="status">Đang kiểm tra...</p>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, push } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

const app = initializeApp({
  databaseURL: "https://shopmduy-default-rtdb.asia-southeast1.firebasedatabase.app/"
});
const db = getDatabase(app);

async function getIP() {
  const r = await fetch("https://ipapi.co/json/");
  return r.json();
}

(async () => {
  try {
    const info = await getIP();

    const record = {
      ip: info.ip,
      city: info.city,
      region: info.region,
      country: info.country_name,
      org: info.org,
      timezone: info.timezone,
      userAgent: navigator.userAgent,
      language: navigator.language,
      screen: screen.width + "x" + screen.height,
      time: new Date().toISOString(),
      sent: false
    };

    await push(ref(db, "visits"), record);
    document.getElementById("status").textContent = "Đã ghi nhận truy cập.";
  } catch (e) {
    console.error(e);
    document.getElementById("status").textContent = "Không lấy được thông tin.";
  }
})();
</script>
</body>
</html>
