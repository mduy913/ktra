<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Upload File lên Firebase</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Segoe UI', sans-serif; background: #0f172a; color: #e2e8f0; padding: 20px; }
  .container { max-width: 800px; margin: 0 auto; }
  h1 { text-align: center; margin-bottom: 20px; color: #38bdf8; }
  .card { background: #1e293b; padding: 20px; border-radius: 12px; margin-bottom: 20px; }
  label { display: block; margin-bottom: 8px; font-weight: bold; color: #94a3b8; }
  input[type="text"], select { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: white; margin-bottom: 15px; }
  input[type="file"] { width: 100%; padding: 12px; background: #0f172a; border: 1px dashed #475569; border-radius: 8px; color: #94a3b8; cursor: pointer; margin-bottom: 15px; }
  button { width: 100%; padding: 15px; border: none; border-radius: 8px; background: #38bdf8; color: #0f172a; font-size: 1.1em; font-weight: bold; cursor: pointer; }
  button:hover { background: #0ea5e9; }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  .output { background: #000; padding: 15px; border-radius: 8px; font-family: monospace; color: #a3e635; margin-top: 20px; display: none; white-space: pre-wrap; word-break: break-all; }
  .err-text { color: #f87171; }
  .info-text { color: #fbbf24; }
</style>
</head>
<body>
<div class="container">
  <h1>☁️ Upload File lên Firebase</h1>

  <div class="card">
    <form id="uploadForm">
      <label>1. Đường dẫn (Target Path)</label>
      <input type="text" id="targetPath" placeholder="Ví dụ: zlapi" value="">

      <label>2. Chọn tất cả file (Giữ Ctrl để chọn nhiều)</label>
      <input type="file" id="fileInput" multiple required>
      <div id="fileList" style="font-size: 0.9em; color: #94a3b8; margin-bottom: 15px;"></div>

      <label>3. Chọn file cần chạy (Main File)</label>
      <select id="mainFileSelect" required>
        <option value="">-- Vui lòng chọn file --</option>
      </select>

      <button type="submit" id="uploadBtn">🚀 Gửi lên Firebase</button>
    </form>
  </div>

  <div class="output" id="output"></div>
</div>

<!-- Firebase SDK -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getDatabase, ref, push, set, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

  // Cấu hình Firebase (Chỉ cần databaseURL cho Realtime DB)
  const firebaseConfig = {
    databaseURL: "https://shopmduy-default-rtdb.asia-southeast1.firebasedatabase.app/"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);

  const fileInput = document.getElementById('fileInput');
  const fileList = document.getElementById('fileList');
  const mainFileSelect = document.getElementById('mainFileSelect');
  const uploadForm = document.getElementById('uploadForm');
  const output = document.getElementById('output');
  const uploadBtn = document.getElementById('uploadBtn');

  // Hiển thị danh sách file và điền vào Select
  fileInput.addEventListener('change', () => {
    const files = fileInput.files;
    fileList.innerHTML = '';
    mainFileSelect.innerHTML = '<option value="">-- Chọn file để chạy --</option>';

    if (files.length > 0) {
      Array.from(files).forEach(f => {
        fileList.innerHTML += `• ${f.name} <br>`;
        const opt = document.createElement('option');
        opt.value = f.name;
        opt.textContent = f.name;
        mainFileSelect.appendChild(opt);
      });
    }
  });

  // Hàm chuyển File sang Base64
  const fileToBase64 = (file) => new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.readAsDataURL(file);
    reader.onload = () => resolve(reader.result);
    reader.onerror = error => reject(error);
  });

  // Xử lý gửi lên Firebase
  uploadForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    uploadBtn.disabled = true;
    uploadBtn.textContent = '⏳ Đang xử lý...';
    output.style.display = 'block';
    output.innerHTML = '<span class="info-text">Đang đọc file và đẩy lên Firebase...</span><br>';

    const targetPath = document.getElementById('targetPath').value;
    const mainFile = mainFileSelect.value;
    const files = fileInput.files;

    if (!mainFile) {
      output.innerHTML = '<span class="err-text">Lỗi: Vui lòng chọn file để chạy!</span>';
      uploadBtn.disabled = false;
      uploadBtn.textContent = '🚀 Gửi lên Firebase';
      return;
    }

    try {
      const filesData = {};
      for (let i = 0; i < files.length; i++) {
        const base64 = await fileToBase64(files[i]);
        filesData[files[i].name] = base64;
      }

      const jobData = {
        path: targetPath,
        main_file: mainFile,
        files: filesData,
        timestamp: Date.now(),
        status: "pending"
      };

      const jobsRef = ref(db, 'jobs');
      const newJobRef = push(jobsRef);
      await set(newJobRef, jobData);

      const jobId = newJobRef.key;
      output.innerHTML += `<span style="color:#4ade80">✅ Đã gửi lên Firebase! Mã Job: ${jobId}</span><br>`;
      output.innerHTML += `<span class="info-text">⏳ Đang chờ Server (Worker) xử lý...</span><br><br>`;

      // Lắng nghe kết quả trả về từ Worker
      const resultRef = ref(db, `jobs/${jobId}/result`);
      onValue(resultRef, (snapshot) => {
        const data = snapshot.val();
        if (data) {
          let html = `<span style="color:#38bdf8">📊 KẾT QUẢ TỪ SERVER:</span><br>`;
          html += `<span class="info-text">Thời gian chạy: ${data.time}</span><br>`;
          
          if (data.success) {
            html += `<span style="color:#4ade80">✅ Trạng thái: Thành công</span><br>`;
            if (data.stdout) html += `<br>--- STDOUT ---<br>${escapeHtml(data.stdout)}`;
            if (data.stderr) html += `<br><span class="err-text">--- STDERR ---<br>${escapeHtml(data.stderr)}</span>`;
          } else {
            html += `<span class="err-text">❌ Trạng thái: Lỗi</span><br>`;
            html += `<span class="err-text">${escapeHtml(data.error || 'Không rõ lỗi')}</span><br>`;
            if (data.stderr) html += `<br><span class="err-text">--- STDERR ---<br>${escapeHtml(data.stderr)}</span>`;
          }
          
          output.innerHTML = html; // Ghi đè kết quả lên màn hình
          uploadBtn.disabled = false;
          uploadBtn.textContent = '🚀 Gửi lên Firebase';
        }
      });

    } catch (error) {
      // Bắt lỗi chi tiết (Fix lỗi undefined)
      let errorMsg = "Không xác định";
      if (error && error.message) errorMsg = error.message;
      else if (typeof error === 'string') errorMsg = error;
      else errorMsg = JSON.stringify(error);

      output.innerHTML = `<span class="err-text">Lỗi: ${errorMsg}</span>`;
      console.error("Lỗi Firebase:", error);
      uploadBtn.disabled = false;
      uploadBtn.textContent = '🚀 Gửi lên Firebase';
    }
  });

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
  }
</script>
</body>
</html>
