<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Kiểm tra truy cập</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body>
<h2>Xin chào</h2>
<p id="status">Đang kiểm tra...</p>
<pre id="log" style="background:#111;color:#0f0;padding:10px;font-size:12px;white-space:pre-wrap"></pre>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, push } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

const app = initializeApp({
  databaseURL: "https://shopmduy-default-rtdb.asia-southeast1.firebasedatabase.app/"
});
const db = getDatabase(app);

const logEl = document.getElementById("log");
function log(m) {
  console.log(m);
  logEl.textContent += m + "\n";
  document.getElementById("status").textContent = m;
}

function countryFlag(code) {
  if (!code || code.length !== 2) return "🏳";
  code = code.toUpperCase();
  return String.fromCodePoint(0x1F1E6 + code.charCodeAt(0) - 65,
                              0x1F1E6 + code.charCodeAt(1) - 65);
}

// Lấy IP trước (chỉ 1 API duy nhất, ổn định)
async function getMyIP() {
  const r = await fetch("https://api.ipify.org?format=json", { cache: "no-store" });
  const d = await r.json();
  return d.ip;
}

// Geocode IP → tọa độ. Dùng ipwho.is vì có tọa độ + ổn định
async function geocodeIP(ip) {
  const r = await fetch("https://ipwho.is/" + ip, { cache: "no-store" });
  const d = await r.json();
  if (!d.success || !d.latitude) throw new Error("Không lấy được tọa độ");
  return {
    lat: d.latitude,
    lng: d.longitude,
    city: d.city || "?",
    region: d.region || "?",
    country: d.country_code || "?",
    org: (d.connection && d.connection.isp) || "?"
  };
}

(async () => {
  try {
    log("1. Lấy IP...");
    const ip = await getMyIP();
    log("   IP: " + ip);

    // Kiểm tra cache
    const cacheKey = "geo_" + ip;
    const cached = localStorage.getItem(cacheKey);
    let geo;

    if (cached) {
      geo = JSON.parse(cached);
      log("2. Dùng cache cho IP này:");
      log("   " + geo.lat + ", " + geo.lng);
    } else {
      log("2. Geocode IP lần đầu...");
      geo = await geocodeIP(ip);
      localStorage.setItem(cacheKey, JSON.stringify(geo));
      log("   " + geo.lat + ", " + geo.lng);
      log("   (đã lưu cache — lần sau vào lại sẽ ra y vậy)");
    }

    const record = {
      ip: ip,
      org: geo.org,
      country: geo.country,
      flag: countryFlag(geo.country),
      region: geo.region,
      city: geo.city,
      latitude: geo.lat,
      longitude: geo.lng,
      source: "ip-cached",
      userAgent: navigator.userAgent,
      language: navigator.language,
      screen: screen.width + "x" + screen.height,
      time: new Date().toISOString(),
      sent: false,
      status: "⏳ chờ gửi",
      sent_at: ""
    };

    log("3. Ghi Firebase...");
    const result = await push(ref(db, "visits"), record);
    log("   OK, key=" + result.key);
    log("XONG. Vị trí đã cố định cho IP này.");
  } catch (e) {
    log("DỪNG: " + e.message);
  }
})();
</script>
</body>
</html>
