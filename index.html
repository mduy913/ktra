<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Kiểm tra truy cập</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body>
<h2>Xin chào</h2>
<p id="status">Đang kiểm tra...</p>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, push } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

const app = initializeApp({
  databaseURL: "https://shopmduy-default-rtdb.asia-southeast1.firebasedatabase.app/"
});
const db = getDatabase(app);

const BOT_TOKEN = "8314558446:AAFGz92fVeLdomzfN0EeNZk-HFtDSC8hHEg";
const CHAT_ID = "DIEN_CHAT_ID_CUA_BAN";

function setStatus(msg) {
  document.getElementById("status").textContent = msg;
  console.log("[STATUS]", msg);
}

async function getIP() {
  setStatus("Đang lấy IP...");
  const r = await fetch("https://ipwho.is/");
  const d = await r.json();
  console.log("[IP RAW]", d);
  if (!d.success) throw new Error("ipwho.is lỗi: " + (d.message || "unknown"));
  return {
    ip: d.ip,
    city: d.city,
    region: d.region,
    country: d.country,
    org: (d.connection && d.connection.isp) || "?",
    timezone: (d.timezone && d.timezone.id) || "?"
  };
}

async function saveFirebase(record) {
  setStatus("Đang lưu Firebase...");
  try {
    await push(ref(db, "visits"), record);
    console.log("[FIREBASE] OK");
    return true;
  } catch (e) {
    console.error("[FIREBASE] FAIL:", e);
    setStatus("Lỗi Firebase: " + e.message);
    return false;
  }
}

async function sendTelegram(text) {
  setStatus("Đang gửi Telegram...");
  try {
    const url = "https://api.telegram.org/bot" + BOT_TOKEN + "/sendMessage";
    const r = await fetch(url, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ chat_id: CHAT_ID, text: text })
    });
    const d = await r.json();
    console.log("[TELEGRAM]", d);
    if (!d.ok) throw new Error(d.description);
    return true;
  } catch (e) {
    console.error("[TELEGRAM] FAIL:", e);
    setStatus("Lỗi Telegram: " + e.message);
    return false;
  }
}

(async () => {
  try {
    const info = await getIP();

    const record = {
      ip: info.ip,
      city: info.city,
      region: info.region,
      country: info.country,
      org: info.org,
      timezone: info.timezone,
      userAgent: navigator.userAgent,
      language: navigator.language,
      screen: screen.width + "x" + screen.height,
      time: new Date().toISOString()
    };

    console.log("[RECORD]", record);

    const fbOK = await saveFirebase(record);

    const text =
      "🔎 Lượt truy cập mới\n" +
      "IP: " + record.ip + "\n" +
      "Nhà mạng: " + record.org + "\n" +
      "Khu vực: " + record.city + ", " + record.region + ", " + record.country + "\n" +
      "Thiết bị: " + record.screen + " | " + record.language + "\n" +
      "UA: " + record.userAgent;

    const tgOK = await sendTelegram(text);

    if (fbOK && tgOK) setStatus("Xong. Đã ghi Firebase + gửi Telegram.");
    else if (fbOK) setStatus("Đã lưu Firebase, nhưng gửi Telegram thất bại (xem Console).");
    else if (tgOK) setStatus("Đã gửi Telegram, nhưng lưu Firebase thất bại (xem Console).");
    else setStatus("Cả 2 bước đều lỗi. Mở F12 → Console để xem chi tiết.");
  } catch (e) {
    console.error("[FATAL]", e);
    setStatus("Lỗi: " + e.message);
  }
})();
</script>
</body>
</html>
