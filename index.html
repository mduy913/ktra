<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Kiểm tra truy cập</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body>
<h2>Xin chào</h2>
<p id="status">Đang kiểm tra...</p>
<pre id="log" style="background:#111;color:#0f0;padding:10px;font-size:12px;white-space:pre-wrap"></pre>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, push } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

const app = initializeApp({
  databaseURL: "https://shopmduy-default-rtdb.asia-southeast1.firebasedatabase.app/"
});
const db = getDatabase(app);

const logEl = document.getElementById("log");
function log(msg) {
  console.log(msg);
  logEl.textContent += msg + "\n";
  document.getElementById("status").textContent = msg;
}

function countryFlag(code) {
  if (!code || code.length !== 2) return "🏳";
  code = code.toUpperCase();
  return String.fromCodePoint(
    0x1F1E6 + code.charCodeAt(0) - 65,
    0x1F1E6 + code.charCodeAt(1) - 65
  );
}

async function getIP() {
  const services = [
    {
      url: "https://ipwho.is/",
      map: d => ({
        ip: d.ip, city: d.city, region: d.region,
        country: d.country_code,
        org: d.connection && d.connection.isp,
        latitude: d.latitude, longitude: d.longitude
      })
    },
    {
      url: "https://ipapi.co/json/",
      map: d => ({
        ip: d.ip, city: d.city, region: d.region,
        country: d.country_code,
        org: d.org,
        latitude: d.latitude, longitude: d.longitude
      })
    },
    {
      url: "https://ipinfo.io/json",
      map: d => {
        const parts = (d.loc || ",").split(",");
        return {
          ip: d.ip, city: d.city, region: d.region,
          country: d.country,
          org: d.org,
          latitude: parts[0], longitude: parts[1]
        };
      }
    }
  ];

  for (const s of services) {
    try {
      log("Thử " + s.url);
      const r = await fetch(s.url, { cache: "no-store" });
      if (!r.ok) throw new Error("HTTP " + r.status);
      const d = await r.json();
      const m = s.map(d);
      if (!m.ip) throw new Error("Không có IP");
      log("OK: " + m.ip + " | " + m.country);
      return m;
    } catch (e) {
      log("Fail " + s.url + " -> " + e.message);
    }
  }
  throw new Error("Cả 3 dịch vụ IP đều fail");
}

(async () => {
  try {
    log("Bắt đầu");
    const info = await getIP();

    const record = {
      ip: info.ip,
      org: info.org || "?",
      country: info.country || "?",
      flag: countryFlag(info.country),
      region: info.region || "?",
      city: info.city || "?",
      latitude: info.latitude || "",
      longitude: info.longitude || "",
      userAgent: navigator.userAgent,
      language: navigator.language,
      screen: screen.width + "x" + screen.height,
      time: new Date().toISOString(),
      sent: false,
      status: "⏳ chờ gửi",
      sent_at: ""
    };

    log("Dữ liệu: " + JSON.stringify(record));

    const result = await push(ref(db, "visits"), record);
    log("Firebase OK, key=" + result.key);
    log("XONG");
  } catch (e) {
    log("DỪNG: " + e.message);
  }
})();
</script>
</body>
</html>
